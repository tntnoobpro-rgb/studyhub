<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyHub – Bản offline</title><style>:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#182544;background:#f5f7fd;--text:#182544;--muted:#66738d;--bg:#f5f7fd;--panel:#fff;--edge:#e5e9f4;--blue:#405ee9;--soft:#edf0ff;--green:#147c52;--red:#bd3547;--shadow:0 12px 40px rgba(44,64,122,.08)}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}a{color:inherit;text-decoration:none}.top{background:var(--panel);border-bottom:1px solid var(--edge);position:sticky;top:0;z-index:10}.nav{max-width:1160px;margin:auto;display:flex;align-items:center;gap:20px;justify-content:space-between;padding:14px 22px}.brand{font-size:22px;font-weight:850;letter-spacing:-.8px;color:var(--blue);white-space:nowrap}.brand span{background:var(--blue);color:white;border-radius:10px;padding:5px 8px;margin-right:7px}.navright{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.wrap{max-width:1160px;padding:34px 22px 70px;margin:auto}.hero{padding:34px 0 24px}.eyebrow{font-weight:750;color:var(--blue);font-size:13px;text-transform:uppercase;letter-spacing:1.1px}h1{font-size:clamp(29px,5vw,46px);line-height:1.13;letter-spacing:-1.5px;margin:13px 0}h2{font-size:25px;letter-spacing:-.6px;margin:0 0 14px}h3{margin:0 0 10px;font-size:18px}p{line-height:1.65}.muted{color:var(--muted)}.tiny{font-size:13px}.btn{border:1px solid var(--edge);background:var(--panel);color:var(--text);padding:11px 16px;border-radius:12px;font-weight:750;transition:all .16s}.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 14px #233d9820}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.soft{background:var(--soft);border-color:var(--soft);color:var(--blue)}.btn.danger{color:var(--red)}.btn.small{padding:8px 11px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:var(--panel);border:1px solid var(--edge);border-radius:20px;padding:23px;box-shadow:var(--shadow)}.setcard{display:flex;flex-direction:column;min-height:240px}.setcard .bottom{margin-top:auto;padding-top:20px}.tag{display:inline-block;background:var(--soft);color:var(--blue);font-weight:750;padding:6px 11px;border-radius:8px;font-size:12px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.section{margin:27px 0}.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}.field>span{font-weight:700;font-size:14px}input,textarea,select{width:100%;padding:12px 13px;border:1px solid #d7deed;border-radius:11px;background:var(--panel);color:var(--text)}input:focus,textarea:focus,select:focus{outline:2px solid #aebaff;border-color:var(--blue)}textarea{min-height:105px;resize:vertical}input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue)}.check{display:inline-flex;align-items:center;gap:7px;font-size:14px}.pill{border-radius:999px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}.mode{border:1px solid var(--edge);border-radius:18px;padding:21px;background:var(--panel);text-align:left}.mode strong{display:block;margin:10px 0;font-size:18px}.mode .ico{font-size:29px}.mode:hover{border-color:var(--blue);background:var(--soft)}.block{width:100%}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.content{max-width:850px;margin:0 auto}.quizbox{padding:28px}.question{font-size:21px;font-weight:750;white-space:pre-wrap;line-height:1.55;margin:22px 0}.answers{display:grid;gap:11px}.answer{display:flex;align-items:flex-start;gap:14px;text-align:left;width:100%;padding:17px;border:1.5px solid var(--edge);border-radius:13px;background:var(--panel);line-height:1.5}.answer.selected{border-color:var(--blue);background:var(--soft)}.answer.correct{border-color:#49b78b;background:#e8f9ee}.answer.wrong{border-color:#e07884;background:#fff0f1}.letter{display:inline-grid;place-items:center;flex:0 0 29px;height:29px;background:var(--bg);border-radius:8px;font-weight:800}.progress{height:9px;background:var(--edge);border-radius:30px;overflow:hidden}.progress>div{height:100%;background:var(--blue);transition:width .2s}.feedback{padding:17px;border-radius:13px;background:var(--soft);margin-top:18px}.feedback.good{background:#e6f8f0;color:#096d46}.feedback.bad{background:#fff0f2;color:#a42e46}.qnav{display:flex;gap:8px;flex-wrap:wrap}.qnum{width:36px;height:36px;padding:0;border:1px solid var(--edge);background:var(--panel);border-radius:9px}.qnum.current{background:var(--blue);color:white}.qnum.done{border-color:var(--blue)}.flipscene{perspective:1200px;height:325px;cursor:pointer}.flipcard{height:100%;width:100%;position:relative;transform-style:preserve-3d;transition:transform .45s}.flipcard.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--edge);border-radius:24px;background:var(--panel);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;padding:32px;text-align:center;box-shadow:var(--shadow);overflow:auto}.face.back{transform:rotateY(180deg);background:#edf0ff}.face .big{font-size:clamp(20px,3vw,28px);font-weight:750;white-space:pre-wrap;line-height:1.5}.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.matchcol{display:grid;gap:10px;align-content:start}.tile{min-height:95px;padding:16px;background:var(--panel);border:2px solid var(--edge);border-radius:14px;text-align:center;white-space:pre-wrap;line-height:1.4;overflow-wrap:anywhere}.tile.chosen{border-color:var(--blue);background:var(--soft)}.tile.matched{opacity:.25;background:#dcfce8;pointer-events:none}.tile.error{border-color:var(--red);background:#fff0f2}.notice{border-left:3px solid var(--blue);background:var(--soft);padding:14px 18px;border-radius:8px;line-height:1.6}.editq{padding:17px;border:1px solid var(--edge);border-radius:15px;margin:14px 0;background:var(--panel)}.editq .field{margin:8px 0}.optionrow{display:flex;gap:9px;align-items:center;margin-bottom:8px}.optionrow input[type=checkbox]{flex:0 0 18px}.optionrow input[type=text]{flex:1}.optionrow .btn{flex:0 0 auto}.stat{font-size:32px;font-weight:850;color:var(--blue)}.empty{text-align:center;padding:65px 25px}.loading{text-align:center;padding:70px}.hidden{display:none!important}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#19243d;color:white;border-radius:12px;padding:12px 21px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}#toast.show{opacity:1}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:42px}.divider{height:1px;background:var(--edge);margin:24px 0}.details{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:12px 16px}.details summary{cursor:pointer;font-weight:750}.search{max-width:400px}.right{margin-left:auto}.dangerline{color:var(--red)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:24px 15px 60px}.nav{padding:12px 15px}.twocol{grid-template-columns:1fr}.quizbox{padding:18px}.top .hide-mobile{display:none}}@media(max-width:560px){.grid{grid-template-columns:1fr}.nav{gap:7px}.brand{font-size:18px}.navright{gap:5px}.navright .btn{padding:8px;font-size:12px}.card{padding:19px}.question{font-size:18px}.answer{padding:13px}.flipscene{height:310px}.matchgrid{gap:8px}.tile{font-size:13px;padding:10px;min-height:86px}.hero{padding-top:15px}}body.dark{--text:#eaf0ff;--muted:#abb5d1;--bg:#11192a;--panel:#1c2840;--edge:#36435e;--soft:#263b72;--blue:#97abff;--shadow:none;background:var(--bg);color:var(--text)}body.dark .btn.primary{background:#647bff;color:white;border-color:#647bff}body.dark input,body.dark textarea,body.dark select{border-color:#43516c}body.dark .letter{background:#32405b}body.dark .face.back{background:#27375a}body.dark .answer.correct{background:#1c4f3e}body.dark .answer.wrong{background:#592b38}body.dark .feedback.good{background:#194331;color:#a4f5ce}body.dark .feedback.bad{background:#522635;color:#ffc3cb}
</style></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><script>/* StudyHub frontend – vanilla JavaScript, no bundler required */
'use strict';
const sample={id:'demo',title:'Bộ câu hỏi mẫu – Kiến thức tổng hợp',description:'Bộ mẫu để thử Trắc nghiệm, Flashcard và Match.',subject:'Học thử',visibility:'public',owner_name:'StudyHub',questions:[
 {id:'d1',position:1,prompt:'Thủ đô của Việt Nam là thành phố nào?',options:[{id:'a',text:'Hà Nội'},{id:'b',text:'Huế'},{id:'c',text:'Đà Nẵng'},{id:'d',text:'TP. Hồ Chí Minh'}],answers:['a'],verified:true,explanation:'Hà Nội là thủ đô của Việt Nam.',topic:'Địa lý'},
 {id:'d2',position:2,prompt:'H₂O là công thức hóa học của chất nào?',options:[{id:'a',text:'Muối ăn'},{id:'b',text:'Nước'},{id:'c',text:'Oxi'},{id:'d',text:'Khí cacbonic'}],answers:['b'],verified:true,explanation:'Một phân tử nước gồm hai nguyên tử hiđro và một nguyên tử oxi.',topic:'Hóa học'},
 {id:'d3',position:3,prompt:'2 + 3 bằng bao nhiêu?',options:[{id:'a',text:'4'},{id:'b',text:'6'},{id:'c',text:'5'},{id:'d',text:'7'}],answers:['c'],verified:true,explanation:'2 + 3 = 5.',topic:'Toán'},
 {id:'d4',position:4,prompt:'Từ tiếng Hàn 산 nghĩa là gì?',options:[{id:'a',text:'Biển'},{id:'b',text:'Núi'},{id:'c',text:'Công viên'},{id:'d',text:'Trường học'}],answers:['b'],verified:true,explanation:'산 có nghĩa là núi.',topic:'Tiếng Hàn'},
 {id:'d5',position:5,prompt:'Đâu là các số nguyên tố?',options:[{id:'a',text:'2'},{id:'b',text:'4'},{id:'c',text:'3'},{id:'d',text:'9'}],answers:['a','c'],verified:true,explanation:'2 và 3 là số nguyên tố.',topic:'Toán'},
 {id:'d6',position:6,prompt:'Mặt Trời là một...',options:[{id:'a',text:'Hành tinh'},{id:'b',text:'Ngôi sao'},{id:'c',text:'Vệ tinh'},{id:'d',text:'Thiên thạch'}],answers:['b'],verified:true,explanation:'Mặt Trời là ngôi sao ở trung tâm Hệ Mặt Trời.',topic:'Khoa học'}
]};
const S={user:null,sets:[],set:null,isOwner:false,view:'home',edit:[],draft:[],quiz:null,flash:null,match:null,progress:{},theme:localStorage.getItem('sh-theme')||'light',seconds:0};
const $=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const newId=()=>globalThis.crypto?.randomUUID?.()||Math.random().toString(36).slice(2);
const date=d=>d?new Date(d).toLocaleDateString('vi-VN'):'';
const t=(msg)=>{let el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(t.timer);t.timer=setTimeout(()=>el.classList.remove('show'),3300);};
const btn=(s,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${s}</button>`;
async function api(url,method='GET',data){
  const store=()=>JSON.parse(localStorage.getItem('sh-offline-sets')||'[]');
  const persist=v=>localStorage.setItem('sh-offline-sets',JSON.stringify(v));
  if(url==='/api/me')return {user:{id:'offline-user',name:'Bạn (offline)',email:'local@studyhub'}};
  if(url==='/api/sets'&&method==='GET')return {sets:store().map(x=>({...x,count:x.questions.length}))};
  if(url==='/api/sets'&&method==='POST'){
    let x={id:newId(),title:data.title,description:data.description||'',subject:data.subject||'',visibility:'private',owner_name:'Bạn (offline)',questions:[],created_at:new Date().toISOString(),updated_at:new Date().toISOString()};
    persist([...store(),x]);return {set:x};
  }
  let m=url.match(/^\/api\/sets\/([^/]+)(?:\/(questions|progress))?$/);
  if(m){let id=m[1],part=m[2],sets=store(),index=sets.findIndex(x=>x.id===id),x=sets[index];if(!x)throw Error('Không tìm thấy bộ học.');
    if(!part&&method==='GET')return {set:x,isOwner:true};
    if(!part&&method==='DELETE'){sets.splice(index,1);persist(sets);return {ok:true};}
    if(!part&&method==='PUT'){Object.assign(x,data);persist(sets);return {set:x};}
    if(part==='questions'&&method==='PUT'){
      if(!Array.isArray(data.questions))throw Error('Danh sách không hợp lệ');
      x.questions=data.questions.map((q,i)=>({...q,id:newId(),position:i+1}));persist(sets);return {count:x.questions.length,set:x};
    }
    if(part==='progress'){
      const key='sh-offline-sync-'+id;
      if(method==='GET')return {progress:JSON.parse(localStorage.getItem(key)||'null')};
      if(method==='PUT'){localStorage.setItem(key,JSON.stringify(data.progress));return {ok:true};}
    }
  }
  if(url==='/api/extract'&&method==='POST'){
    let file=data.get('file');let ext=file.name.split('.').pop().toLowerCase();
    if(!['txt','csv','md','json'].includes(ext))throw Error('Bản offline chỉ đọc TXT, CSV, JSON. Hãy chạy máy chủ để đọc PDF, Word, PowerPoint, Excel.');
    return {text:await file.text(),filename:file.name};
  }
  if(url==='/api/auth/logout')return {ok:true};
  throw Error('Tính năng yêu cầu bản website có máy chủ.');
}
function localKey(){return 'sh-progress-'+(S.user?.id||'guest')+'-'+S.set.id;}
async function loadProgress(){let p=JSON.parse(localStorage.getItem(localKey())||'{}');if(S.user&&S.set.id!=='demo'){try{let server=(await api('/api/sets/'+S.set.id+'/progress')).progress;if(server)p=server;}catch{}}S.progress=p||{};}
function saveProgress(){if(!S.set)return;localStorage.setItem(localKey(),JSON.stringify(S.progress));if(S.user&&S.set.id!=='demo')api('/api/sets/'+S.set.id+'/progress','PUT',{progress:S.progress}).catch(()=>{});}
function layout(body){document.body.classList.toggle('dark',S.theme==='dark');$('app').innerHTML=`<header class="top"><nav class="nav"><a href="/" class="brand" onclick="event.preventDefault();goHome()"><span>✦</span>StudyHub</a><div class="navright">${btn('⌂ Trang chủ','goHome()','small hide-mobile')}${S.user?btn('＋ Tạo bộ học','newSet()','small primary'):''}${btn(S.theme==='dark'?'☀':'☾','toggleTheme()','small')}${S.user?`<span class="tiny hide-mobile">${safe(S.user.name)}</span>${btn('Đăng xuất','logout()','small')}`:btn('Đăng nhập','authPage()','small primary')}</div></nav></header><main class="wrap">${body}<footer class="footer">BẢN OFFLINE – Dữ liệu chỉ lưu trên trình duyệt hiện tại. Không thể chia sẻ bộ học giữa các thiết bị.<br>StudyHub • Học tập theo cách của bạn • Đáp án chưa xác minh sẽ không được tự động chấm đúng</footer></main>`;}
function toggleTheme(){S.theme=S.theme==='dark'?'light':'dark';localStorage.setItem('sh-theme',S.theme);render();}
async function boot(){try{S.user=(await api('/api/me')).user;await listSets();let m=location.pathname.match(/^\/study\/([^/]+)/);if(m)await openSet(m[1],false);else render();}catch(e){layout(`<section class="card empty"><h2>Không kết nối được máy chủ</h2><p>${safe(e.message)}</p><p>Chạy <code>npm install</code> và <code>npm start</code> trong thư mục dự án.</p></section>`);}}
async function listSets(){let r=await api('/api/sets');S.sets=r.sets||[];}
function goHome(){history.pushState({},'', '/');S.view='home';S.set=null;listSets().then(render).catch(e=>t(e.message));}
function render(){if(S.view==='home')home();else if(S.view==='auth')authPage(true);else if(S.view==='new')newSet(true);else if(S.view==='set')setPage();else if(S.view==='edit')editPage();else if(S.view==='import')importPage();else if(S.view==='quiz')quizPage();else if(S.view==='result')resultPage();else if(S.view==='flash')flashPage();else if(S.view==='match')matchPage();else home();}
function home(){const q=($('search')?.value||'').toLowerCase();const items=[sample,...S.sets].filter(x=>(x.title+x.subject).toLowerCase().includes(q));layout(`<section class="hero"><div class="eyebrow">Nền tảng tự học tương tác</div><h1>Học tập hiệu quả hơn,<br><span style="color:var(--blue)">theo cách của bạn.</span></h1><p class="muted">Một bộ câu hỏi – nhiều cách học: trắc nghiệm, lật thẻ, ghép cặp và thi thử. Giữ nguyên thứ tự câu hỏi gốc khi cần.</p><div class="row">${btn('＋ Tạo bộ ôn tập','newSet()','primary')}${btn('▶ Thử bộ học mẫu',"openSet('demo')",'soft')}</div></section><section class="section"><div class="row between"><h2>Thư viện bộ học</h2><input id="search" class="search" placeholder="⌕ Tìm môn học, tài liệu..." value="${safe(q)}" oninput="filterCards(this.value)"></div><div class="grid" id="setgrid">${cards(items)}</div></section><div class="notice">💡 <b>Cách bắt đầu:</b> Đăng ký tài khoản, tạo bộ học, dán nội dung trắc nghiệm hoặc tải tài liệu, kiểm tra đáp án và chia sẻ link. Bộ mẫu có thể học không cần đăng nhập.</div>`);}
function filterCards(v){$('setgrid').innerHTML=cards([sample,...S.sets].filter(x=>(x.title+x.subject).toLowerCase().includes(v.toLowerCase())));}
function cards(items){return items.length?items.map(x=>`<article class="card setcard"><div><span class="tag">${safe(x.subject||'Tổng hợp')}</span><h3 style="margin-top:17px">${safe(x.title)}</h3><p class="muted tiny">${x.questions?.length??x.count??0} câu hỏi • ${safe(x.owner_name||'')}</p><p class="tiny muted">${safe(x.description||'')}</p></div><div class="bottom">${btn('Mở bộ học →',`openSet('${x.id}')`,'primary block')}</div></article>`).join(''):'<div class="card">Chưa tìm thấy bộ học phù hợp.</div>';}
async function openSet(id,route=true){try{if(id==='demo'){S.set=structuredClone(sample);S.isOwner=false;}else{let r=await api('/api/sets/'+encodeURIComponent(id));S.set=r.set;S.isOwner=r.isOwner;}await loadProgress();S.view='set';if(route)history.pushState({},'',`/study/${id}`);render();}catch(e){t(e.message);if(route)goHome();}}
function setPage(){let x=S.set;let questions=x.questions||[];let valid=questions.filter(q=>q.verified&&q.answers.length),topics=[...new Set(questions.map(q=>q.topic).filter(Boolean))];layout(`<div class="content"><div class="row between"><span class="tag">${safe(x.subject||'Bộ học')}</span><span class="tiny muted">${safe(x.owner_name||'')} • ${x.visibility==='private'?'Riêng tư':x.visibility==='public'?'Công khai':'Chia sẻ link'}</span></div><h1>${safe(x.title)}</h1><p class="muted">${safe(x.description||'Chọn cách bạn muốn ôn tập.')}</p><div class="row"><span class="tag">${questions.length} câu hỏi</span><span class="tag">${valid.length} có đáp án xác minh</span><span class="tag">${topics.length} chủ đề</span></div><section class="section grid"><button class="mode" onclick="quizConfig(false)"><div class="ico">☑️</div><strong>Trắc nghiệm</strong><span class="muted tiny">Làm bài, biết đúng sai và xem lời giải</span></button><button class="mode" onclick="startFlash()"><div class="ico">🗂️</div><strong>Flashcard</strong><span class="muted tiny">Lật thẻ, ghi nhớ và học lại</span></button><button class="mode" onclick="matchConfig()"><div class="ico">🧩</div><strong>Match</strong><span class="muted tiny">Ghép câu hỏi với đáp án đúng</span></button><button class="mode" onclick="quizConfig(true)"><div class="ico">⏱️</div><strong>Thi thử</strong><span class="muted tiny">Chấm điểm khi nộp bài</span></button><button class="mode" onclick="startWrong()"><div class="ico">🔄</div><strong>Ôn câu sai</strong><span class="muted tiny">Ôn riêng câu bạn thường nhầm</span></button>${S.isOwner?`<button class="mode" onclick="editQuestions()"><div class="ico">✏️</div><strong>Quản lý câu hỏi</strong><span class="muted tiny">Sửa câu, đáp án, kiểm tra tính chính xác</span></button>`:''}</section><div class="card"><h3>Chia sẻ bộ học</h3>${x.visibility==='private'?'<p class="muted tiny">Bộ học đang riêng tư. Chỉ chủ sở hữu mở được. Đổi quyền để chia sẻ.</p>':'<p class="muted tiny">Ai có đường link này có thể học, kể cả không đăng nhập.</p>'}<div class="row"><input aria-label="Link bộ học" value="${safe(location.origin+'/study/'+x.id)}" readonly style="flex:1;min-width:150px">${btn('Không hỗ trợ chia sẻ offline','copyLink()','soft')}</div>${S.isOwner?`<div class="divider"></div><div class="field"><span>Quyền truy cập</span><select id="visibility"><option value="private" ${x.visibility==='private'?'selected':''}>Riêng tư</option><option value="unlisted" ${x.visibility==='unlisted'?'selected':''}>Ai có link</option><option value="public" ${x.visibility==='public'?'selected':''}>Công khai trên thư viện</option></select></div>${btn('Lưu quyền chia sẻ','updateVisibility()','primary')}${btn('Nhập / thêm tài liệu','importStart()')}${btn('Xuất JSON','exportJSON()')}${btn('Xóa bộ học','deleteSet()','danger')}`:''}</div></div>`);}
function copyLink(){t('Bản offline không thể chia sẻ dữ liệu qua link. Hãy dùng bản máy chủ.');return; navigator.clipboard?.writeText(location.origin+'/study/'+S.set.id).then(()=>t('Đã sao chép liên kết.')).catch(()=>t('Hãy sao chép link trong ô bên cạnh.'));}
async function updateVisibility(){try{let x=S.set;let o=await api('/api/sets/'+x.id,'PUT',{title:x.title,description:x.description,subject:x.subject,visibility:$('visibility').value});S.set=o.set;t('Đã cập nhật quyền chia sẻ.');render();}catch(e){t(e.message);}}
async function deleteSet(){if(!confirm('Xóa vĩnh viễn bộ học và tất cả câu hỏi?'))return;try{await api('/api/sets/'+S.set.id,'DELETE');t('Đã xóa bộ học.');goHome();}catch(e){t(e.message);}}
function exportJSON(){download(S.set.title+'.json',JSON.stringify({title:S.set.title,questions:S.set.questions},null,2),'application/json');}
function download(name,data,type){let b=new Blob([data],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name.replace(/[\\/:*?"<>|]/g,'_');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function authPage(preserve=false){t('Bản offline sử dụng hồ sơ cục bộ, không cần đăng nhập.');goHome();return;S.view='auth';layout(`<div class="content card" style="max-width:520px"><h2>Đăng nhập / đăng ký</h2><p class="muted">Để tạo bộ học và lưu tiến độ trực tuyến.</p><form onsubmit="submitAuth(event)"><div class="field"><span>Chế độ</span><select id="authmode" onchange="document.getElementById('namewrap').classList.toggle('hidden',this.value!=='register')"><option value="login">Đăng nhập</option><option value="register">Đăng ký tài khoản mới</option></select></div><div id="namewrap" class="field hidden"><span>Tên hiển thị</span><input id="aname" autocomplete="name"></div><div class="field"><span>Email</span><input type="email" id="aemail" required autocomplete="email"></div><div class="field"><span>Mật khẩu</span><input type="password" id="apass" minlength="8" required autocomplete="current-password"></div><button class="btn primary block" type="submit">Tiếp tục</button></form></div>`);}
async function submitAuth(e){e.preventDefault();try{let mode=$('authmode').value;let r=await api('/api/auth/'+mode,'POST',{name:$('aname').value,email:$('aemail').value,password:$('apass').value});S.user=r.user;t('Đăng nhập thành công.');goHome();}catch(e){t(e.message);}}
async function logout(){t('Đây là chế độ offline.');return;await api('/api/auth/logout','POST',{});S.user=null;t('Đã đăng xuất.');goHome();}
function newSet(preserve=false){if(!S.user){t('Không đọc được hồ sơ offline.');return;}S.view='new';layout(`<div class="content card" style="max-width:620px"><h2>＋ Tạo bộ ôn tập</h2><form onsubmit="createSet(event)"><div class="field"><span>Tên bộ học *</span><input id="stitle" required placeholder="Ví dụ: Ôn tập Kỹ thuật bao bì"></div><div class="field"><span>Môn học / chủ đề</span><input id="ssubject" placeholder="Công nghệ thực phẩm"></div><div class="field"><span>Mô tả</span><textarea id="sdesc" placeholder="Nội dung, phạm vi ôn tập..."></textarea></div><button class="btn primary" type="submit">Tạo bộ học và nhập câu hỏi</button></form></div>`);}
async function createSet(e){e.preventDefault();try{let r=await api('/api/sets','POST',{title:$('stitle').value,subject:$('ssubject').value,description:$('sdesc').value});S.set=r.set;S.isOwner=true;S.edit=[];S.view='import';history.pushState({},'', '/study/'+S.set.id);render();}catch(e){t(e.message);}}
function importStart(){S.edit=structuredClone(S.set.questions||[]);S.view='import';render();}
function importPage(){layout(`<div class="content"><div class="row between"><h2>Nhập tài liệu / câu hỏi</h2>${btn('← Quay lại','returnSet()')}</div><div class="notice">Hỗ trợ trích xuất văn bản từ PDF, DOCX, PPTX, XLSX, TXT, CSV và JSON. <b>Không mặc định AI tự đoán đáp án.</b> Bạn cần kiểm tra bản xem trước; PDF scan có thể không đọc được.</div><div class="card section"><h3>1. Chọn nguồn dữ liệu</h3><div class="field"><span>Tải tài liệu</span><input id="uploadfile" type="file" accept=".pdf,.docx,.txt,.csv,.json,.xlsx,.xls,.pptx,.md" onchange="readUpload(event)"></div><div class="field"><span>Hoặc dán nội dung câu hỏi</span><textarea id="rawtext" rows="10" style="min-height:200px" placeholder="Câu 1. Nội dung câu hỏi\nA. Phương án A\nB. Phương án B\nC. Phương án C\nD. Phương án D\nĐáp án: B\n\nCâu 2. ..."></textarea></div><div class="row">${btn('Phân tích câu hỏi','parseImport()','primary')}${btn('Tải file mẫu TXT','sampleTXT()','soft')}${btn('Nhập câu thủ công','addQuestionFromImport()')}</div></div><div class="card section"><h3>2. Câu hỏi trong bộ: <span id="importcount">${S.edit.length}</span></h3><p class="muted tiny">Câu nhập mới được thêm vào cuối danh sách. Mở trình quản lý để duyệt, đặt đáp án hoặc sửa từng câu.</p>${btn('Xem và xác minh câu hỏi','editQuestions()','primary')}${btn('Lưu ngay bộ câu hỏi','saveEdits()')}</div></div>`);}
function sampleTXT(){download('mau-cau-hoi-studyhub.txt','Câu 1. Thủ đô Việt Nam là?\nA. Huế\nB. Hà Nội\nC. Đà Nẵng\nD. Cần Thơ\nĐáp án: B\nGiải thích: Hà Nội là thủ đô.\n\nCâu 2. Chọn các số nguyên tố.\nA. 2\nB. 4\nC. 3\nD. 9\nĐáp án: A, C','text/plain');}
async function readUpload(e){let file=e.target.files?.[0];if(!file)return;if(file.name.toLowerCase().endsWith('.json')){try{let obj=JSON.parse(await file.text());let list=Array.isArray(obj)?obj:obj.questions;if(Array.isArray(list)){S.edit.push(...list.map(importJSONQuestion));t(`Đã nhập ${list.length} câu JSON. Vào quản lý để xác minh.`);$('importcount').textContent=S.edit.length;return;}}catch(ex){t('JSON chưa đúng định dạng.');return;}}try{let fd=new FormData();fd.append('file',file);let r=await api('/api/extract','POST',fd);$('rawtext').value=r.text;t('Đã đọc file. Vui lòng kiểm tra văn bản và bấm Phân tích.');}catch(ex){t(ex.message);}}
function importJSONQuestion(q){let opts=(q.options||[]).map(o=>typeof o==='string'?{id:newId(),text:o}:{id:o.id||newId(),text:o.text||''});let sourceIds=new Set(opts.map(o=>o.id));return {id:newId(),position:S.edit.length+1,prompt:q.prompt||q.question||'',options:opts,answers:(q.answers||[]).filter(a=>sourceIds.has(a)),verified:!!q.verified,explanation:q.explanation||'',topic:q.topic||'',source:q.source||''};}
function parseImport(){let text=$('rawtext').value.trim();if(!text){t('Chưa có nội dung để phân tích.');return;}let list=parseQuestions(text);if(!list.length){t('Không nhận diện được câu hỏi. Hãy dùng mẫu TXT hoặc nhập thủ công.');return;}S.edit.push(...list);t(`Đã nhận diện ${list.length} câu. Hãy kiểm tra đáp án.`);editQuestions();}
function parseQuestions(src){src=src.replace(/\r/g,'').replace(/\u00a0/g,' ');let lines=src.split('\n'),res=[],cur=null,opt=null;let flush=()=>{if(cur&&cur.prompt.trim()&&cur.options.length>=2){if(cur.pending){let letters=cur.pending.toUpperCase().match(/[A-H]/g)||[];cur.answers=cur.options.filter((o,i)=>letters.includes('ABCDEFGH'[i])).map(o=>o.id);cur.verified=cur.answers.length>0;}delete cur.pending;cur.position=res.length+1;res.push(cur);}cur=null;opt=null;};for(let line of lines){let s=line.trim();if(!s)continue;let head=s.match(/^(?:Câu\s*|Question\s*|Q\s*)(\d+)\s*[.:)\-–]\s*(.*)$/i);if(!head)head=s.match(/^(\d{1,4})[.)]\s+(.+)$/);if(head){flush();cur={id:newId(),prompt:head[2],options:[],answers:[],verified:false,explanation:'',topic:'',source:''};continue;}if(!cur)continue;let op=s.match(/^([A-H])[.):\-]\s*(.+)$/i);if(op){opt={id:newId(),text:op[2]};cur.options.push(opt);continue;}let ans=s.match(/^(?:Đáp\s*án(?:\s*đúng)?|Answer|Correct\s*answer)\s*[:：\-]\s*(.+)$/i);if(ans){cur.pending=ans[1].split(/[,;/\s]+/).map(a=>a.trim()).filter(a=>/^[A-H]$/i.test(a)).join('');opt=null;continue;}let explain=s.match(/^(?:Giải\s*thích|Explanation|Lời\s*giải)\s*[:：\-]\s*(.+)$/i);if(explain){cur.explanation=explain[1];opt=null;continue;}if(opt)opt.text+=' '+s;else cur.prompt+='\n'+s;}flush();return res;}
function addQuestionFromImport(){S.edit.push({id:newId(),position:S.edit.length+1,prompt:'Câu hỏi mới',options:[{id:newId(),text:'Phương án A'},{id:newId(),text:'Phương án B'}],answers:[],verified:false,explanation:'',topic:'',source:''});editQuestions();}
function editQuestions(){if(S.view==='set')S.edit=structuredClone(S.set.questions||[]);S.view='edit';render();}
function editPage(){layout(`<div><div class="row between"><div><h2>Quản lý và xác minh câu hỏi</h2><p class="muted">${S.edit.length} câu • Giữ nguyên thứ tự hiển thị. Đánh dấu ô bên trái phương án đúng.</p></div>${btn('＋ Thêm câu','addEditQ()')}${btn('✓ Lưu bộ học','saveEdits()','primary')}</div><div class="notice">Vui lòng kiểm tra nội dung và đáp án. Những câu chưa xác minh không được đưa vào tính điểm, Flashcard hoặc Match.</div><div id="editlist">${S.edit.map(editQHTML).join('')}</div><div class="row section">${btn('＋ Thêm câu','addEditQ()')}${btn('✓ Lưu bộ học','saveEdits()','primary')}${btn('← Quay lại','returnSet()')}</div></div>`);}
function editQHTML(q,i){return `<div class="editq" id="edit-${i}"><div class="row between"><strong>Câu ${i+1}</strong><span class="tag">${q.verified&&q.answers.length?'Đã xác minh':'Chưa xác minh'}</span><button class="btn small danger" onclick="deleteEdit(${i})">Xóa</button></div><div class="field"><span>Nội dung câu hỏi</span><textarea oninput="S.edit[${i}].prompt=this.value">${safe(q.prompt)}</textarea></div><div class="field"><span>Phương án (tích chọn đáp án đúng)</span>${q.options.map((o,j)=>`<div class="optionrow"><input type="checkbox" aria-label="Đáp án đúng" ${q.answers.includes(o.id)?'checked':''} onchange="toggleCorrect(${i},${j},this.checked)"><input type="text" value="${safe(o.text)}" oninput="S.edit[${i}].options[${j}].text=this.value"><button class="btn small" title="Xóa phương án" onclick="removeOption(${i},${j})">×</button></div>`).join('')}<button class="btn small soft" onclick="addOption(${i})" ${q.options.length>=8?'disabled':''}>＋ Phương án</button></div><label class="check"><input type="checkbox" ${q.verified?'checked':''} onchange="S.edit[${i}].verified=this.checked"> Tôi đã kiểm tra và xác minh đáp án</label><div class="twocol"><div class="field"><span>Chủ đề</span><input value="${safe(q.topic)}" oninput="S.edit[${i}].topic=this.value"></div><div class="field"><span>Nguồn / trang</span><input value="${safe(q.source)}" oninput="S.edit[${i}].source=this.value"></div></div><div class="field"><span>Giải thích (không bắt buộc)</span><textarea oninput="S.edit[${i}].explanation=this.value">${safe(q.explanation)}</textarea></div></div>`;}
function toggleCorrect(i,j,val){let q=S.edit[i],id=q.options[j].id;if(val&&!q.answers.includes(id))q.answers.push(id);else if(!val)q.answers=q.answers.filter(x=>x!==id);}
function deleteEdit(i){if(confirm(`Xóa câu ${i+1}?`)){S.edit.splice(i,1);render();}}
function addEditQ(){S.edit.push({id:newId(),prompt:'',options:[{id:newId(),text:''},{id:newId(),text:''},{id:newId(),text:''},{id:newId(),text:''}],answers:[],verified:false,explanation:'',topic:'',source:''});render();document.getElementById('edit-'+(S.edit.length-1))?.scrollIntoView({behavior:'smooth'});}
function removeOption(i,j){if(S.edit[i].options.length<=2){t('Cần ít nhất 2 phương án.');return;}let id=S.edit[i].options[j].id;S.edit[i].options.splice(j,1);S.edit[i].answers=S.edit[i].answers.filter(a=>a!==id);render();}
function addOption(i){if(S.edit[i].options.length>=8)return;S.edit[i].options.push({id:newId(),text:''});render();}
async function saveEdits(){try{let payload=S.edit.map((q,i)=>({...q,position:i+1,verified:!!q.verified&&q.answers.length>0}));let r=await api('/api/sets/'+S.set.id+'/questions','PUT',{questions:payload});S.set=r.set;S.edit=structuredClone(r.set.questions);t(`Đã lưu ${r.count} câu hỏi.`);S.view='set';render();}catch(e){t(e.message);}}
function returnSet(){S.view='set';render();}
function eligible(){return S.set.questions.filter(q=>q.verified&&q.answers?.length&&q.options?.length>=2);}
function quizConfig(isExam,onlyWrong=false){let all=eligible().filter(q=>!onlyWrong||S.progress.wrong?.includes(q.id));if(!all.length){t(onlyWrong?'Chưa có câu sai cần ôn.':'Chưa có câu được xác minh đáp án.');return;}let topics=[...new Set(all.map(q=>q.topic).filter(Boolean))];layout(`<div class="content card"><h2>${isExam?'⏱️ Cấu hình thi thử':onlyWrong?'🔄 Ôn câu sai':'☑️ Cấu hình trắc nghiệm'}</h2><p class="muted">Có ${all.length} câu đủ điều kiện. Thứ tự câu hỏi mặc định giống tài liệu gốc.</p><div class="field"><span>Số câu muốn làm</span><input id="qcount" type="number" min="1" max="${all.length}" value="${all.length}"></div><div class="field"><span>Chủ đề</span><select id="qtopic"><option value="">Tất cả</option>${topics.map(x=>`<option value="${safe(x)}">${safe(x)}</option>`).join('')}</select></div><div class="field"><span>Thời gian thi (phút, 0 = không giới hạn)</span><input type="number" id="qminutes" min="0" max="300" value="${isExam?'30':'0'}"></div><div class="field"><label class="check"><input type="checkbox" id="qshuffle"> Xáo trộn thứ tự câu hỏi</label></div><div class="field"><label class="check"><input type="checkbox" id="ashuffle" checked> Xáo trộn vị trí đáp án A/B/C/D</label></div><div class="row">${btn('Bắt đầu học','launchQuiz('+isExam+','+onlyWrong+')','primary')}${btn('← Quay lại','returnSet()')}</div></div>`);}
function launchQuiz(isExam,onlyWrong){let all=eligible().filter(q=>(!onlyWrong||S.progress.wrong?.includes(q.id))&&(!$('qtopic').value||q.topic===$('qtopic').value));if(!all.length){t('Không có câu nào trong chủ đề đã chọn.');return;}let count=Math.min(all.length,Math.max(1,Number($('qcount').value)||all.length));if($('qshuffle').checked)all=shuffle(all);all=all.slice(0,count);let ansShuf=$('ashuffle').checked;S.quiz={items:all.map(q=>({...q,options:ansShuf?shuffle(q.options):[...q.options]})),choices:{},checked:{},index:0,exam:isExam,started:Date.now(),minutes:Math.max(0,Number($('qminutes').value)||0),finished:false};S.view='quiz';render();}
function startWrong(){quizConfig(false,true);}
function qChoice(id){return S.quiz.choices[id]||[];}
function quizPage(){let z=S.quiz;if(!z)return returnSet();if(z.finished){S.view='result';return resultPage();}let q=z.items[z.index],a=qChoice(q.id),checked=!!z.checked[q.id],correct=q.answers.every(id=>a.includes(id))&&a.length===q.answers.length;let percent=(z.index+1)/z.items.length*100;layout(`<div class="content"><div class="row between"><div><span class="tag">${z.exam?'Thi thử':'Luyện tập'}</span> <span class="tiny muted">Câu ${z.index+1}/${z.items.length}</span></div><span class="tiny muted" id="timer">${z.minutes?'Giới hạn '+z.minutes+' phút':'Không giới hạn thời gian'}</span></div><div class="progress section"><div style="width:${percent}%"></div></div><div class="card quizbox"><div class="row between"><span class="tiny muted">${safe(q.topic||S.set.title)}</span>${btn(S.progress.marked?.includes(q.id)?'★ Đã đánh dấu':'☆ Đánh dấu',`markQuestion('${q.id}')`,'small')}</div><div class="question">${safe(q.prompt)}</div><p class="tiny muted">${q.answers.length>1?'Chọn tất cả đáp án đúng':'Chọn một đáp án đúng'}</p><div class="answers">${q.options.map((o,i)=>{let chosen=a.includes(o.id);let cls=chosen?'selected':'';if(checked){if(q.answers.includes(o.id))cls='correct';else if(chosen)cls='wrong';}return `<button class="answer ${cls}" onclick="chooseAnswer('${q.id}','${o.id}')" ${checked?'disabled':''}><span class="letter">${'ABCDEFGH'[i]}</span><span>${safe(o.text)}</span></button>`;}).join('')}</div>${checked?`<div class="feedback ${correct?'good':'bad'}"><b>${correct?'✓ Chính xác!':'✕ Chưa chính xác'}</b><p>Đáp án: ${safe(q.options.filter(o=>q.answers.includes(o.id)).map(o=>o.text).join(' • '))}</p>${q.explanation?`<p>${safe(q.explanation)}</p>`:''}</div>`:''}${!z.exam&&!checked?`<div class="section">${btn('Kiểm tra đáp án',`checkAnswer()`,'primary')}</div>`:''}<div class="divider"></div><div class="row between">${btn('← Trước','quizMove(-1)','small')}${z.index===z.items.length-1?btn('Nộp bài / Kết thúc','finishQuiz()','primary'):btn('Tiếp →','quizMove(1)','primary')}</div></div><details class="details section"><summary>Chuyển nhanh tới câu hỏi</summary><div class="qnav section">${z.items.map((item,i)=>`<button class="qnum ${i===z.index?'current':''} ${qChoice(item.id).length?'done':''}" onclick="jumpQuiz(${i})">${i+1}</button>`).join('')}</div></details></div>`);updateTimer();}
function chooseAnswer(qid,oid){let z=S.quiz,q=z.items[z.index];if(z.checked[qid])return;let a=qChoice(qid);if(q.answers.length===1){z.choices[qid]=[oid];}else{z.choices[qid]=a.includes(oid)?a.filter(x=>x!==oid):[...a,oid];}render();}
function checkAnswer(){let z=S.quiz,q=z.items[z.index];if(!qChoice(q.id).length){t('Hãy chọn đáp án.');return;}z.checked[q.id]=true;let correct=q.answers.length===qChoice(q.id).length&&q.answers.every(x=>qChoice(q.id).includes(x));saveAttempt(q.id,correct);render();}
function saveAttempt(id,correct){S.progress.attempts=S.progress.attempts||{};let a=S.progress.attempts[id]||{right:0,wrong:0};a[correct?'right':'wrong']++;S.progress.attempts[id]=a;let wrong=new Set(S.progress.wrong||[]);if(correct)wrong.delete(id);else wrong.add(id);S.progress.wrong=[...wrong];saveProgress();}
function markQuestion(id){let marked=new Set(S.progress.marked||[]);marked.has(id)?marked.delete(id):marked.add(id);S.progress.marked=[...marked];saveProgress();render();}
function quizMove(n){let z=S.quiz;if(z.index+n>=0&&z.index+n<z.items.length){z.index+=n;render();}}
function jumpQuiz(i){S.quiz.index=i;render();}
function finishQuiz(){let z=S.quiz;if(!z)return;let unanswered=z.items.filter(q=>!qChoice(q.id).length).length;if(unanswered&&!confirm(`Còn ${unanswered} câu chưa trả lời. Bạn muốn kết thúc?`))return;z.finished=true;z.elapsed=Math.round((Date.now()-z.started)/1000);for(let q of z.items){let a=qChoice(q.id),correct=a.length===q.answers.length&&a.every(x=>q.answers.includes(x));if(a.length&&(z.exam||!z.checked[q.id]))saveAttempt(q.id,correct);}S.progress.history=S.progress.history||[];let score=z.items.filter(q=>qChoice(q.id).length===q.answers.length&&qChoice(q.id).every(x=>q.answers.includes(x))).length;S.progress.history.unshift({date:new Date().toISOString(),score,total:z.items.length,exam:z.exam});S.progress.history=S.progress.history.slice(0,30);saveProgress();S.view='result';render();}
function updateTimer(){let z=S.quiz;if(!z||z.finished||S.view!=='quiz')return;let el=$('timer');if(!el)return;let seconds=Math.floor((Date.now()-z.started)/1000);if(z.minutes){let left=z.minutes*60-seconds;if(left<=0){finishQuiz();return;}el.textContent=`⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;}else el.textContent=`⏱ ${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;}
setInterval(updateTimer,1000);
function resultPage(){let z=S.quiz,score=z.items.filter(q=>qChoice(q.id).length===q.answers.length&&qChoice(q.id).every(x=>q.answers.includes(x))).length;layout(`<div class="content"><div class="card"><span class="tag">Hoàn thành</span><h1>Kết quả ${z.exam?'thi thử':'ôn tập'}</h1><div class="twocol"><div><div class="stat">${(score/z.items.length*10).toFixed(2)}/10</div><p class="muted">${score}/${z.items.length} câu chính xác • ${Math.round(score/z.items.length*100)}%</p></div><div><div class="stat">${Math.floor(z.elapsed/60)}:${String(z.elapsed%60).padStart(2,'0')}</div><p class="muted">Thời gian làm bài</p></div></div><div class="row">${btn('Làm bài mới','quizConfig('+z.exam+')','primary')}${btn('Ôn câu sai','startWrong()')}${btn('Về bộ học','returnSet()')}</div></div><section class="section"><h2>Chi tiết đáp án</h2>${z.items.map((q,i)=>{let chosen=qChoice(q.id),correct=chosen.length===q.answers.length&&chosen.every(x=>q.answers.includes(x));return `<div class="card section"><span class="tag">Câu ${i+1} • ${!chosen.length?'Bỏ qua':correct?'Đúng':'Sai'}</span><h3 style="white-space:pre-wrap;margin-top:12px">${safe(q.prompt)}</h3><p class="tiny">Đã chọn: ${safe(q.options.filter(o=>chosen.includes(o.id)).map(o=>o.text).join(' • ')||'(Chưa trả lời)')}</p><p><b>Đáp án đúng:</b> ${safe(q.options.filter(o=>q.answers.includes(o.id)).map(o=>o.text).join(' • '))}</p>${q.explanation?`<p class="muted">${safe(q.explanation)}</p>`:''}</div>`}).join('')}</section></div>`);}
function startFlash(onlyUnlearned=false){let list=eligible().filter(q=>!onlyUnlearned||!S.progress.learned?.includes(q.id));if(!list.length){t('Không có thẻ cần học.');return;}S.flash={items:list,index:0,flipped:false};S.view='flash';render();}
function flashPage(){let f=S.flash,q=f.items[f.index],learned=S.progress.learned||[];layout(`<div class="content"><div class="row between"><h2>🗂️ Flashcard</h2><span class="tag">${f.index+1}/${f.items.length}</span></div><p class="muted">Chạm vào thẻ để lật • ${learned.filter(x=>f.items.some(q=>q.id===x)).length} thẻ đã nhớ</p><div class="flipscene" onclick="flipFlash()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipFlash()}"><div class="flipcard ${f.flipped?'flipped':''}"><div class="face"><div class="tiny muted">CÂU HỎI • CHẠM ĐỂ LẬT</div><div class="big">${safe(q.prompt)}</div></div><div class="face back"><div class="tiny muted">ĐÁP ÁN ĐÚNG</div><div class="big">${safe(q.options.filter(o=>q.answers.includes(o.id)).map(o=>o.text).join(' • '))}</div><p>${safe(q.explanation)}</p></div></div></div><div class="row between section">${btn('← Trước','flashMove(-1)')}${btn('↻ Lật thẻ','flipFlash()','soft')}${btn('Tiếp →','flashMove(1)')}</div><div class="twocol">${btn('✗ Chưa nhớ','setLearned(false)','block')}${btn('✓ Đã nhớ','setLearned(true)','primary block')}</div><div class="row section">${btn('Chỉ học thẻ chưa nhớ','startFlash(true)','soft')}${btn('Trộn thẻ','shuffleFlash()')}${btn('Về bộ học','returnSet()')}</div></div>`);}
function flipFlash(){S.flash.flipped=!S.flash.flipped;let el=document.querySelector('.flipcard');if(el)el.classList.toggle('flipped',S.flash.flipped);}
function flashMove(dir){let f=S.flash;f.index=(f.index+dir+f.items.length)%f.items.length;f.flipped=false;render();}
function setLearned(v){let q=S.flash.items[S.flash.index],set=new Set(S.progress.learned||[]);v?set.add(q.id):set.delete(q.id);S.progress.learned=[...set];saveProgress();flashMove(1);}
function shuffleFlash(){S.flash.items=shuffle(S.flash.items);S.flash.index=0;S.flash.flipped=false;render();}
function matchPairs(){const qs=eligible().filter(q=>q.answers.length===1&&q.prompt.length<=170&&q.options.find(o=>o.id===q.answers[0])?.text.length<=140);let used=new Set(),pairs=[];for(const q of qs){let a=q.options.find(o=>o.id===q.answers[0]).text.trim();if(used.has(a.toLowerCase()))continue;used.add(a.toLowerCase());pairs.push({id:q.id,left:q.prompt,right:a});}return pairs;}
function matchConfig(){let pairs=matchPairs();if(pairs.length<2){t('Match cần ít nhất 2 câu có đáp án đơn, không trùng nội dung.');return;}S.match={all:pairs,offset:0,size:Math.min(6,pairs.length),wrong:0,started:Date.now(),selected:null,done:[],finished:false};S.view='match';render();}
function matchPage(){let m=S.match;if(m.finished){layout(`<div class="content card empty"><h1>🎉 Ghép cặp hoàn thành!</h1><p><b>${m.wrong}</b> lần ghép sai • <b>${Math.floor((Date.now()-m.started)/1000)}</b> giây</p><div class="row" style="justify-content:center">${btn('Chơi lại','matchConfig()','primary')}${btn('Về bộ học','returnSet()')}</div></div>`);return;}let pairs=m.all.slice(m.offset,m.offset+m.size);if(!m.left||m.round!==m.offset){m.left=shuffle(pairs.map(p=>({id:p.id,text:p.left,side:'left'})));m.right=shuffle(pairs.map(p=>({id:p.id,text:p.right,side:'right'})));m.round=m.offset;}layout(`<div class="content"><div class="row between"><h2>🧩 Match – Ghép cặp</h2><span class="tag">${m.offset+1}–${Math.min(m.offset+m.size,m.all.length)} / ${m.all.length}</span></div><p class="muted">Chọn một câu hỏi bên trái rồi chọn đáp án tương ứng bên phải. Sai: <b id="wrongcount">${m.wrong}</b> lần.</p><div class="matchgrid"><div class="matchcol">${m.left.map(o=>matchTile(o)).join('')}</div><div class="matchcol">${m.right.map(o=>matchTile(o)).join('')}</div></div><div class="row section">${btn('Chơi lại','matchConfig()')}${btn('Về bộ học','returnSet()')}</div></div>`);}
function matchTile(o){return `<button id="tile-${o.side}-${o.id}" class="tile ${S.match.done.includes(o.id)?'matched':''} ${S.match.selected?.id===o.id&&S.match.selected?.side===o.side?'chosen':''}" onclick="pickMatch('${o.side}','${o.id}')">${safe(o.text)}</button>`;}
function pickMatch(side,id){let m=S.match,sel=m.selected;if(m.done.includes(id))return;if(!sel||sel.side===side){m.selected={side,id};render();return;}if(sel.id===id){m.done.push(id);m.selected=null;let pairs=m.all.slice(m.offset,m.offset+m.size);if(m.done.length===pairs.length){if(m.offset+m.size>=m.all.length){m.finished=true;S.progress.matchBest=Math.min(S.progress.matchBest??Infinity,Math.floor((Date.now()-m.started)/1000));saveProgress();render();return;}m.offset+=m.size;m.done=[];m.round=-1;t('Hoàn thành vòng! Chuyển sang vòng tiếp theo.');}render();}else{m.wrong++;m.selected=null;render();let a=$('tile-'+side+'-'+id),b=$('tile-'+sel.side+'-'+sel.id);a?.classList.add('error');b?.classList.add('error');setTimeout(()=>{a?.classList.remove('error');b?.classList.remove('error')},450);}}
window.addEventListener('popstate',()=>{let m=location.pathname.match(/^\/study\/([^/]+)/);if(m)openSet(m[1],false);else goHome();});
window.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(S.view==='quiz'){let i='abcdefgh'.indexOf(e.key.toLowerCase());if(i>=0){let q=S.quiz.items[S.quiz.index];if(q.options[i])chooseAnswer(q.id,q.options[i].id);}if(e.key==='ArrowRight')quizMove(1);if(e.key==='ArrowLeft')quizMove(-1);}else if(S.view==='flash'){if(e.key==='ArrowRight')flashMove(1);if(e.key==='ArrowLeft')flashMove(-1);if(e.key===' ')flipFlash();}});
boot();
</script></body></html>
